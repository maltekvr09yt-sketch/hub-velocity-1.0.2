name: Build Hub-Velocity

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Rozpakuj projekt
        run: |
          unzip -o "hub-velocity-1.0.0-FIX-POM.zip" -d project

      - name: Znajdz pom.xml
        run: |
          POM=$(find "$GITHUB_WORKSPACE/project" -name pom.xml -type f | head -n 1)

          if [ -z "$POM" ]; then
            echo "BLAD: Nie znaleziono pom.xml!"
            echo "Zawartosc projektu:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f
            exit 1
          fi

          echo "Znaleziono:"
          echo "$POM"

          echo "POM=$POM" >> "$GITHUB_ENV"

      - name: Sprawdz konfiguracje Maven
        run: |
          echo "===== POM.XML ====="
          cat "$POM"
          echo "==================="

      - name: Zbuduj plugin
        run: |
          mvn -f "$POM" clean package

      - name: Znajdz JAR
        run: |
          JAR=$(find "$GITHUB_WORKSPACE/project" -path '*/target/*.jar' -type f | head -n 1)

          if [ -z "$JAR" ]; then
            echo "BLAD: Nie znaleziono JAR!"
            exit 1
          fi

          echo "Znaleziony JAR:"
          echo "$JAR"

          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Sprawdz velocity-plugin.json
        run: |
          echo "Sprawdzam:"
          echo "$JAR"

          if unzip -l "$JAR" | grep -q "velocity-plugin.json"; then
            echo ""
            echo "======================================"
            echo "SUKCES!"
            echo "velocity-plugin.json istnieje."
            echo "======================================"
          else
            echo ""
            echo "======================================"
            echo "BLAD!"
            echo "Brak velocity-plugin.json!"
            echo "======================================"
            exit 1
          fi

      - name: Pokaz zawartosc JAR
        run: |
          unzip -l "$JAR"

      - name: Udostepnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: hub-velocity
          path: 'project/**/target/*.jar'
          if-no-files-found: error
