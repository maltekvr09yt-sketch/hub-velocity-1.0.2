name: Build Hub-Velocity

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Znajdz projekt Maven
        run: |
          echo "Aktualny katalog:"
          pwd
          echo "Zawartosc:"
          ls -la

          POM=$(find . -name pom.xml -type f | head -n 1)

          if [ -z "$POM" ]; then
            echo "BLAD: Nie znaleziono pom.xml!"
            exit 1
          fi

          echo "Znaleziono: $POM"
          PROJECT_DIR=$(dirname "$POM")

          echo "Katalog projektu: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "Zawartosc projektu:"
          ls -la

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Zbuduj plugin
        run: |
          cd "$PROJECT_DIR"
          mvn clean package

      - name: Sprawdz velocity-plugin.json
        run: |
          JAR=$(find "$PROJECT_DIR" -path '*/target/*.jar' -type f | head -n 1)

          if [ -z "$JAR" ]; then
            echo "BLAD: Nie znaleziono JAR!"
            exit 1
          fi

          echo "Znaleziony JAR: $JAR"
          echo "Zawartosc JAR:"
          unzip -l "$JAR" | grep "velocity-plugin.json"

      - name: Udostepnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: hub-velocity
          path: '**/target/*.jar'
