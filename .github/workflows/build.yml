name: Build Hub-Velocity

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Rozpakuj projekt
        run: |
          unzip -o "hub-velocity-1.0.0-poprawiony-final.zip" -d project

      - name: Znajdz pom.xml
        run: |
          POM=$(find "$GITHUB_WORKSPACE/project" -name pom.xml -type f | head -n 1)

          if [ -z "$POM" ]; then
            echo "BLAD: Nie znaleziono pom.xml!"
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f
            exit 1
          fi

          echo "Znaleziono: $POM"
          echo "POM=$POM" >> "$GITHUB_ENV"

      - name: Zbuduj plugin
        run: |
          mvn -f "$POM" clean package

      - name: Sprawdz velocity-plugin.json
        run: |
          JAR=$(find "$GITHUB_WORKSPACE/project" -path '*/target/*.jar' -type f | head -n 1)

          if [ -z "$JAR" ]; then
            echo "BLAD: Nie znaleziono JAR!"
            exit 1
          fi

          echo "Znaleziony JAR: $JAR"
          unzip -l "$JAR" | grep "velocity-plugin.json"

      - name: Udostepnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: hub-velocity
          path: 'project/**/target/*.jar'
