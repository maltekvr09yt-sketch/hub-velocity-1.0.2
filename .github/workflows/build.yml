name: Build Hub-Velocity

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Znajdz pom.xml
        run: |
          POM=$(find "$GITHUB_WORKSPACE" -name pom.xml -type f | head -n 1)
          echo "Znaleziono: $POM"
          echo "POM=$POM" >> "$GITHUB_ENV"

      - name: Zbuduj plugin
        run: |
          mvn -f "$POM" clean package

      - name: Sprawdz velocity-plugin.json
        run: |
          JAR=$(find "$GITHUB_WORKSPACE" -path '*/target/hub-velocity-1.0.0.jar' -type f | head -n 1)
          echo "JAR: $JAR"
          unzip -l "$JAR" | grep 'velocity-plugin.json'

      - name: Udostepnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: hub-velocity-1.0.0
          path: '**/target/hub-velocity-1.0.0.jar'
